name: Build Kanji dataset

on:
  push:
    branches: [feature/v1.1]
    paths:
      - 'kanji-joyo.json'
      - 'scripts/build-kanji-data.mjs'
      - '.github/workflows/build-kanji-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate runtime dataset
        run: node scripts/build-kanji-data.mjs
      - name: Switch app to optimized runtime dataset
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'index.html';
          let s = fs.readFileSync(path, 'utf8');
          s = s.replace('const DATA_URL="./kanji-joyo.json";', 'const DATA_URL="./kanji-data.json";');
          s = s.replace('در حال آماده‌سازی ۲۰۰۰ کانجی...', 'در حال آماده‌سازی ۲۱۳۶ کانجی...');
          s = s.replace('این نسخه ۲۰۰۰ مورد اول را بر اساس رتبهٔ newspaper frequency انتخاب می‌کند.', 'این نسخه شامل هر ۲۱۳۶ کانجی Jōyō بر اساس رتبهٔ newspaper frequency است.');
          s = s.replace('  const ranked=all.filter(x=>x.frequency!=null).sort((a,b)=>a.frequency-b.frequency);', '');
          s = s.replace('  if(ranked.length<2000)throw new Error("Kanji dataset contains fewer than 2000 frequency-ranked entries");', '  if(all.length!==2136)throw new Error(`Runtime kanji dataset must contain 2136 entries, got ${all.length}`);');
          s = s.replace('  state.deck=ranked.slice(0,2000).map((x,i)=>({id:x.character,character:x.character,meaning:(x.meanings?.en||[]).slice(0,3),on:(x.readings?.on||[]).slice(0,4),kun:(x.readings?.kun||[]).slice(0,4),strokes:x.stroke_count,grade:x.grade,jlpt:x.jlpt_waller||null,frequency:x.frequency,order:i+1}));', '  state.deck=all;');
          s = s.replace('Array.isArray(x)&&x.length===2000', 'Array.isArray(x)&&x.length===2136');
          fs.writeFileSync(path, s);
          NODE
      - name: Validate dataset
        run: |
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('kanji-data.json','utf8')); if(d.count!==2136 || !Array.isArray(d.kanji) || d.kanji.length!==2136) throw new Error('Invalid Jōyō runtime dataset'); console.log('Validated 2,136 Jōyō kanji');"
      - name: Commit generated dataset and runtime changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kanji-data.json index.html
          git diff --cached --quiet || git commit -m 'build: generate optimized 2136-kanji runtime dataset'
          git push
