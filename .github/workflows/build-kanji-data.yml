name: Build Kanji dataset

on:
  push:
    branches: [feature/v1.1]
    paths:
      - 'kanji-joyo.json'
      - 'scripts/build-kanji-data.mjs'
      - '.github/workflows/build-kanji-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate runtime dataset
        run: node scripts/build-kanji-data.mjs
      - name: Validate dataset
        run: |
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('kanji-data.json','utf8')); if(d.count!==2136 || !Array.isArray(d.kanji) || d.kanji.length!==2136) throw new Error('Invalid Jōyō dataset'); console.log('Validated 2,136 Jōyō kanji');"
      - name: Commit generated dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kanji-data.json
          git diff --cached --quiet || git commit -m 'build: generate complete Jōyō runtime dataset'
          git push
