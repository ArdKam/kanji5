name: Deploy Kanji 5 to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "react-dist/**"
      - "index.html"
      - "supabase-config.js"
      - "supabase-sync.js"
      - "app-bootstrap.js"
      - "react-entry.js"
      - "account-fallback.js"
      - "learning-card-flip-runtime.js"
      - "learning-card-flip-runtime.css"
      - "sw.js"
      - ".github/workflows/pages-deploy.yml"
      - "e2e/react-learning-card-flip.spec.mjs"
      - "e2e/react-personal-mnemonic.spec.mjs"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build shipped React artifact
        working-directory: frontend
        run: npm run build

      - name: Install root test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Verify learning card flip
        run: npx playwright test --timeout=30000 --retries=0 e2e/react-learning-card-flip.spec.mjs
      - name: Verify personal mnemonic flow
        run: npx playwright test --timeout=30000 --retries=0 e2e/react-personal-mnemonic.spec.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Commit rebuilt React artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-dist
          if git diff --cached --quiet; then
            echo "react-dist already matches source"
          else
            git commit -m "build: refresh shipped React artifact from source"
            git push origin HEAD:main
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
