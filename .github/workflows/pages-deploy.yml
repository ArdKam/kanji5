name: Deploy Kanji 5 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout release tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Typecheck frontend
        continue-on-error: true
        working-directory: frontend
        run: npm run typecheck

      - name: Build shipped React artifact from source
        working-directory: frontend
        run: npm run build

      - name: Validate shipped React artifact
        run: node scripts/test-react-shipped-artifact.mjs

      - name: Sync generated React artifact into repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-dist/kanji5-react.js react-dist/kanji5-react.css
          if git diff --cached --quiet; then
            echo "Generated React artifact already matches the repository."
          else
            git commit -m "chore(build): sync generated React artifact"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify Mnemonic support is present in shipped React artifact
        run: node -e "const fs=require('fs'); const js=fs.readFileSync('react-dist/kanji5-react.js','utf8'); if(!js.includes('mnemonic-support') || !js.includes('mnemonic-prepared')) process.exit(1); console.log('Mnemonic support is present in the shipped React bundle.');"

      - name: Install root test dependencies
        run: npm ci

      - name: Verify account UI end-to-end
        continue-on-error: true
        run: npx playwright test --timeout=30000 --retries=0 e2e/react-account-shell.spec.mjs

      - name: Upload freshly built GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          base="https://ardkam.github.io/kanji5"
          probe="$(date +%s%N)"
          curl -fsSL "$base/index.html?probe=$probe" > /tmp/kanji5-index.html
          curl -fsSL "$base/react-entry-release18.js?probe=$probe" > /tmp/kanji5-entry.js
          curl -fsSL "$base/sw-release18.js?probe=$probe" > /tmp/kanji5-sw.js
          curl -fsSL "$base/react-dist/kanji5-react-release18.js?probe=$probe" > /tmp/kanji5-react.js
          grep -q "20260926-release18" /tmp/kanji5-index.html
          grep -q "20260926-release18" /tmp/kanji5-entry.js
          grep -q "kanji5-shell-v167" /tmp/kanji5-sw.js
          grep -q "practice-home" /tmp/kanji5-react.js
          grep -q "dictionary-card-accordion" /tmp/kanji5-react.js
          echo "LIVE_PAGES_ARTIFACT_VERIFIED"
