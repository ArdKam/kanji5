name: Deploy Kanji 5 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout release tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Typecheck frontend
        continue-on-error: true
        working-directory: frontend
        run: npm run typecheck

      - name: Build shipped React artifact from source
        working-directory: frontend
        run: |
          npm run build
          cp ../react-dist/kanji5-react.js ../react-dist/kanji5-react-release18.js
          cp ../react-dist/kanji5-react.css ../react-dist/kanji5-react-release18.css

      - name: Validate shipped React artifact
        run: node scripts/test-react-shipped-artifact.mjs

      - name: Sync generated React artifact into repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-dist/kanji5-react.js react-dist/kanji5-react.css react-dist/kanji5-react-release18.js react-dist/kanji5-react-release18.css
          if git diff --cached --quiet; then
            echo "Generated React artifact already matches the repository."
          else
            git commit -m "chore(build): sync generated React artifact"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify Mnemonic support is present in shipped React artifact
        run: node -e "const fs=require('fs'); const js=fs.readFileSync('react-dist/kanji5-react.js','utf8'); if(!js.includes('mnemonic-support') || !js.includes('mnemonic-prepared')) process.exit(1); console.log('Mnemonic support is present in the shipped React bundle.');"

      - name: Install root test dependencies
        run: npm ci

      - name: Upload freshly built GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live GitHub Pages artifact
        shell: bash
        run: |
          set -u
          base="https://ardkam.github.io/kanji5"
          probe="$(date +%s%N)"
          fetch_with_retry() {
            local url="$1"
            local file="$2"
            local expected="$3"
            local attempt status
            for attempt in $(seq 1 30); do
              status="$(curl -sS -L -o "$file" -w '%{http_code}' "$url?probe=$probe" || true)"
              echo "LIVE_CHECK attempt=$attempt status=$status url=$url"
              if [ "$status" = "200" ] && grep -q "$expected" "$file"; then
                return 0
              fi
              sleep 2
            done
            echo "LIVE_CHECK_FAILED url=$url"
            echo "---- response preview ----"
            head -c 500 "$file" || true
            echo
            return 1
          }
          fetch_with_retry "$base/" /tmp/kanji5-root.html "react-entry-release18.js"
          fetch_with_retry "$base/react-entry-release18.js" /tmp/kanji5-entry.js "kanji5-react-release18.js"
          fetch_with_retry "$base/sw-release18.js" /tmp/kanji5-sw.js "kanji5-shell-v167"
          fetch_with_retry "$base/react-dist/kanji5-react-release18.js" /tmp/kanji5-react.js "practice-home"
          fetch_with_retry "$base/react-dist/kanji5-react-release18.css" /tmp/kanji5-react.css "dictionary-card-accordion"
          echo "LIVE_PAGES_ARTIFACT_VERIFIED"
