name: Deploy Kanji 5 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout release tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Typecheck frontend
        continue-on-error: true
        working-directory: frontend
        run: npm run typecheck

      - name: Build shipped React artifact from source
        working-directory: frontend
        run: npm run build

      - name: Validate shipped React artifact
        run: node scripts/test-react-shipped-artifact.mjs
      - name: Verify Mnemonic support is present in shipped React artifact
        run: node -e "const fs=require('fs'); const js=fs.readFileSync('react-dist/kanji5-react.js','utf8'); if(!js.includes('mnemonic-support') || !js.includes('mnemonic-prepared')) process.exit(1); console.log('Mnemonic support is present in the shipped React bundle.');"

      - name: Install root test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Verify Mnemonic UI end-to-end
        continue-on-error: true
        run: npx playwright test --timeout=30000 --retries=0 e2e/react-prepared-mnemonic.spec.mjs

      - name: Verify account UI end-to-end
        continue-on-error: true
        run: npx playwright test --timeout=30000 --retries=0 e2e/react-account-shell.spec.mjs

      - name: Upload freshly built GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
