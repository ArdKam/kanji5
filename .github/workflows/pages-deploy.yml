name: Deploy Kanji 5 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout release tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Stamp release asset cache-bust
        env:
          KANJI5_RELEASE: ${{ github.sha }}
        run: node scripts/stamp-release.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build shipped React artifact from source
        working-directory: frontend
        run: npm run build

      - name: Validate shipped React artifact
        run: node scripts/test-react-shipped-artifact.mjs

      - name: Install root test dependencies
        run: npm ci

      - name: Run contract and unit suite
        run: npm test

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run React presentation E2E gates
        run: |
          npx playwright test --timeout=30000 --retries=0 e2e/react-presentation-migration.spec.mjs
          npx playwright test --timeout=30000 --retries=0 e2e/react-presentation-parity.spec.mjs
          npx playwright test --timeout=30000 --retries=0 e2e/react-presentation-offline.spec.mjs
          npx playwright test --timeout=30000 --retries=0 e2e/react-experience-session-isolation.spec.mjs
          npx playwright test --timeout=30000 --retries=0 e2e/react-accessibility.spec.mjs
          npx playwright test --timeout=30000 --retries=0 e2e/react-pwa-release.spec.mjs
          npx playwright test --timeout=30000 --retries=0 e2e/react-final-release-matrix.spec.mjs
          npx playwright test --timeout=30000 --retries=0 e2e/react-experience-nav-visual.spec.mjs
          npx playwright test --timeout=30000 --retries=0 e2e/react-account-shell.spec.mjs
          npx playwright test --timeout=30000 --retries=0 e2e/react-learning-card-flip.spec.mjs
          npx playwright test --timeout=30000 --retries=0 e2e/react-personal-mnemonic.spec.mjs
          npx playwright test --timeout=30000 --retries=0 e2e/react-review-practice.spec.mjs

      - name: Upload freshly built GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
