name: Deploy Rinemi to GitHub Pages

on:
  workflow_run:
    workflows:
      - "React presentation build"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact verified React commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify verified React commit is still current main
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$current"
          if [ "$current" != "$RELEASE_SHA" ]; then
            echo "A newer main commit exists; refusing to deploy stale workflow_run $RELEASE_SHA."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Dependency audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high --no-fund
      - name: Vendor pinned Supabase browser runtime
        working-directory: .
        run: node scripts/vendor-supabase.mjs

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build shipped React artifact from source
        working-directory: frontend
        run: npm run build

      - name: Validate shipped React artifact
        run: node scripts/test-react-shipped-artifact.mjs
      - name: Validate generated presentation contracts
        run: |
          node scripts/test-performance-font-loading.mjs
          node scripts/test-service-worker-shell.mjs
          node scripts/test-react-release-integrity.mjs

      - name: Verify Mnemonic support is present in shipped React artifact
        run: node -e "const fs=require('fs'); const js=fs.readFileSync('react-dist/kanji5-react.js','utf8'); if(!js.includes('mnemonic-support') || !js.includes('mnemonic-prepared')) process.exit(1); console.log('Mnemonic support is present in the shipped React bundle.');"

      - name: Install root test dependencies
        run: npm ci
      - name: Dependency audit (root)
        run: npm audit --audit-level=high --no-fund

      - name: Run root contract/unit suite
        run: npm test

      - name: Install Chromium for cross-layer release gate
        run: npx playwright install chromium

      - name: Run engine-to-React boundary gate
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-engine-boundary-gate.spec.mjs

      - name: Stage production GitHub Pages site
        run: node scripts/stage-pages-site.mjs

      - name: Run R12 public-release security checks
        run: node scripts/test-r12-security.mjs _site
      - name: Verify staged production site
        run: node scripts/verify-pages-site.mjs

      - name: Upload freshly built GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live GitHub Pages artifact
        shell: bash
        run: |
          set -u
          base="https://ardkam.github.io/kanji5"
          probe="$(date +%s%N)"
          fetch_with_retry() {
            local url="$1"
            local file="$2"
            local expected="$3"
            local attempt status
            for attempt in $(seq 1 30); do
              status="$(curl -sS -L -o "$file" -w '%{http_code}' "$url?probe=$probe" || true)"
              echo "LIVE_CHECK attempt=$attempt status=$status url=$url"
              if [ "$status" = "200" ] && grep -q "$expected" "$file"; then
                return 0
              fi
              sleep 2
            done
            echo "LIVE_CHECK_FAILED url=$url"
            echo "---- response preview ----"
            head -c 500 "$file" || true
            echo
            return 1
          }
          fetch_with_retry "$base/" /tmp/kanji5-root.html "react-entry.js"
          fetch_with_retry "$base/react-entry.js" /tmp/kanji5-entry.js "react-dist/kanji5-react.js"
          fetch_with_retry "$base/sw.js" /tmp/kanji5-sw.js "react-dist/kanji5-react.js"
          fetch_with_retry "$base/react-dist/kanji5-react.js" /tmp/kanji5-react.js "practice-home"
          fetch_with_retry "$base/react-dist/kanji5-react.css" /tmp/kanji5-react.css "dictionary-card"
          echo "---- live security response headers ----"
          headers="$(curl -sSI -L "$base/" || true)"
          printf '%s\n' "$headers"
          csp_header="$(printf '%s\n' "$headers" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^content-security-policy:/{sub(/^[^:]*:[[:space:]]*/,"");print}')"
          if [ -n "$csp_header" ]; then
            printf '%s\n' "$csp_header" | grep -F "script-src 'self'" >/dev/null
            if printf '%s\n' "$csp_header" | grep -Eiq "cdn\\.jsdelivr\\.net|esm\\.sh|unpkg\\.com"; then
              echo "LIVE_CSP_HEADER_REMOTE_RUNTIME_PRESENT"
              exit 1
            fi
            echo "LIVE_CSP_HEADER=verified"
          else
            echo "LIVE_CSP_HEADER=absent; HTML meta CSP remains the source-level control for this Pages deployment."
          fi

          verify_live_matches_staged() {
            local url="$1"
            local staged="$2"
            local live="$3"
            local attempt staged_sha live_sha status
            staged_sha="$(sha256sum "$staged" | awk '{print $1}')"
            for attempt in $(seq 1 30); do
              status="$(curl -sS -L -o "$live" -w '%{http_code}' "$url?probe=$probe" || true)"
              live_sha=""
              if [ "$status" = "200" ]; then
                live_sha="$(sha256sum "$live" | awk '{print $1}')"
              fi
              echo "LIVE_HASH_CHECK attempt=$attempt status=$status url=$url staged=$staged_sha live=$live_sha"
              if [ "$status" = "200" ] && [ "$staged_sha" = "$live_sha" ]; then
                return 0
              fi
              sleep 2
            done
            echo "LIVE_HASH_CHECK_FAILED url=$url"
            return 1
          }

          verify_live_matches_staged "$base/index.html" _site/index.html /tmp/kanji5-live-root.html
          verify_live_matches_staged "$base/react-entry.js" _site/react-entry.js /tmp/kanji5-live-entry.js
          verify_live_matches_staged "$base/sw.js" _site/sw.js /tmp/kanji5-live-sw.js
          verify_live_matches_staged "$base/react-dist/kanji5-react.js" _site/react-dist/kanji5-react.js /tmp/kanji5-live-react.js
          verify_live_matches_staged "$base/react-dist/kanji5-react.css" _site/react-dist/kanji5-react.css /tmp/kanji5-live-react.css
          verify_live_matches_staged "$base/vendor/supabase-js-2.117.2.js" _site/vendor/supabase-js-2.117.2.js /tmp/kanji5-live-supabase.js
          echo "LIVE_PAGES_ARTIFACT_VERIFIED"

      - name: Run live GitHub Pages offline and core-product E2E
        run: node scripts/verify-live-pages-e2e.mjs
