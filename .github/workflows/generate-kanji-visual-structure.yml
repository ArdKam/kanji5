name: Generate KanjiVG visual structure data

on:
  push:
    branches:
      - fix/kanji-visual-structure-2136
    paths:
      - "scripts/build-kanji-visual-structure.mjs"
      - ".github/workflows/generate-kanji-visual-structure.yml"

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[generated-structure]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate pinned KanjiVG visual structures
        run: node scripts/build-kanji-visual-structure.mjs
      - name: Commit generated dataset to feature branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanji-visual-structure.json
          if git diff --cached --quiet; then
            echo "Generated KanjiVG data matches the current branch."
            exit 0
          fi
          git commit -m "data: generate KanjiVG visual structure [generated-structure]"
          git push origin "HEAD:${BRANCH_NAME}"
