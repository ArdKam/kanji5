name: Enable v1.3 education settings

on:
  push:
    branches:
      - feature/v1.3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v1.3
          fetch-depth: 1

      - name: Apply settings wiring
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          p1 = Path('v1.3-p1.js').read_text(encoding='utf-8')

          # Load P1 and settings before the existing v1.2 enhancement layer.
          marker = '<script src="./v1.2-enhancements.js"></script>'
          scripts = '<script src="./v1.3-p1.js"></script><script src="./v1.3-settings.js"></script>'
          if 'src="./v1.3-p1.js"' not in index:
              if marker not in index:
                  raise SystemExit('Could not locate enhancement script marker')
              index = index.replace(marker, scripts + marker, 1)

          # Make the P1 mode selector respect the saved settings.
          old = 'function chooseMode(ch, hasWords){\n    const modes=["meaning","reading","production"];\n    if(hasWords)modes.push("vocabulary","context");'
          new = 'function chooseMode(ch, hasWords){\n    const settings = window.KANJI5_EDUCATION_SETTINGS?.read?.() || {production:true,vocabulary:true,context:true};\n    const modes=["meaning","reading"];\n    if(settings.production)modes.push("production");\n    if(hasWords && settings.vocabulary)modes.push("vocabulary");\n    if(hasWords && settings.context)modes.push("context");'
          if old in p1:
              p1 = p1.replace(old, new, 1)
          elif 'window.KANJI5_EDUCATION_SETTINGS?.read?.()' not in p1:
              raise SystemExit('Could not locate chooseMode')

          Path('index.html').write_text(index, encoding='utf-8')
          Path('v1.3-p1.js').write_text(p1, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check v1.3-p1.js
          node --check v1.3-settings.js
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text(encoding='utf-8')
          p1 = Path('v1.3-p1.js').read_text(encoding='utf-8')
          assert 'src="./v1.3-p1.js"' in index
          assert 'src="./v1.3-settings.js"' in index
          assert 'window.KANJI5_EDUCATION_SETTINGS?.read?.()' in p1
          print('Education settings validation passed')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html v1.3-p1.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'feat(v1.3): add education mode toggles [skip ci]'
            git push origin HEAD:feature/v1.3
          fi
