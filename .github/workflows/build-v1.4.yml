name: Build Kanji 5 v1.4

on:
  push:
    branches: [feature/v1.4]
    paths:
      - 'index.html'
      - 'kanji-data.json'
      - 'kanji-joyo.json'
      - 'scripts/**'
      - 'v1.4-*.js'
      - 'v1.3-p0.js'
      - 'v1.3-perf.js'
      - 'v1.3-storage-bridge.js'
      - 'v1.3-settings.js'
      - 'supabase-sync.js'
      - 'supabase-schema.sql'
      - 'vendor/ts-fsrs-5.4.1.mjs'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '.github/workflows/build-v1.4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply canonical v1.4 wiring
        run: node scripts/apply-v1.3-static.mjs
      - name: Validate dataset
        run: node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('kanji-data.json','utf8'));if(d.count!==2136||!Array.isArray(d.kanji)||d.kanji.length!==2136)throw new Error('Invalid runtime dataset');"
      - name: Validate JavaScript
        run: |
          node --check v1.3-p0.js
          node --check v1.3-perf.js
          node --check v1.3-storage-bridge.js
          node --check v1.3-settings.js
          node --check v1.4-education-migration.js
          node --check v1.4-education-core.js
          node --check v1.4-education-ui.js
          node --check scripts/apply-v1.3-static.mjs
          node --check supabase-sync.js
          node --check sw.js
          node --check vendor/ts-fsrs-5.4.1.mjs
      - name: Validate v1.4 contracts
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const w=fs.readFileSync('sw.js','utf8');const p=fs.readFileSync('v1.4-education-core.js','utf8');const u=fs.readFileSync('v1.4-education-ui.js','utf8');const m=fs.readFileSync('v1.4-education-migration.js','utf8');for(const s of ['./v1.3-p0.js','./v1.3-perf.js','./v1.3-storage-bridge.js','./v1.3-settings.js','./v1.4-education-migration.js','./v1.4-education-core.js','./v1.4-education-ui.js'])if(h.split('<script src=\"'+s+'\"></script>').length-1!==1)throw new Error(s+' must be included exactly once');if(h.includes('./v1.3-p1.js')||h.includes('./v1.3-education-runtime-fix.js')||h.includes('./v1.3-production-ui.js')||h.includes('./v1.3-education-v2.js'))throw new Error('Legacy v1.3 education UI is still wired');if(!p.includes('getStage')||!p.includes('selectExercise')||!p.includes('chooseBestExercise')||!p.includes('selectEducationItem')||!p.includes('chooseDistractors'))throw new Error('State/adaptive core missing');if(!u.includes('CORE.selectEducationItem')||!u.includes('CORE.chooseBestExercise')||!u.includes('CORE.gradeMeaning')||!u.includes('CORE.gradeReading')||!u.includes('CORE.recordKnowledge'))throw new Error('UI is bypassing v1.4 core');if(!u.includes('fetchContextSentences')||!u.includes('api.tatoeba.org/v1/sentences')||!u.includes('edu.sentence.text.replaceAll(item.character')||!u.includes('edu.sentence.english'))throw new Error('Context sentence exercise wiring missing');if(!u.includes('CORE.chooseDistractors'))throw new Error('Smart distractor core wiring missing');if(!u.includes('const safe=')&&!u.includes('function escapeHTML'))throw new Error('External content escaping helper missing');if(!u.includes('safe(edu.sentence.english)')&&!u.includes('escapeHTML(edu.sentence.english)'))throw new Error('Sentence translation is not escaped');if(!u.includes(\"modes.filter(x=>x==='meaning'||x==='reading'||x==='production')\"))throw new Error('Safe external-data fallback missing');if(!u.includes(\"checkButton=(edu.mode==='vocabulary'||edu.mode==='context')\"))throw new Error('MCQ action-state fix missing');if(!u.includes('v14EduDontKnow'))throw new Error('Dont know action missing');if(!m.includes('schemaVersion=1')||!m.includes('kanji5-v1.4-education-meta'))throw new Error('Education migration missing');if(!w.includes('./v1.4-education-migration.js')||!w.includes('./v1.4-education-core.js')||!w.includes('./v1.4-education-ui.js'))throw new Error('Service worker shell is missing v1.4 education files');if(!w.includes('TATOEBA_ORIGIN')||!w.includes(\"u.pathname.startsWith('/v1/sentences')\"))throw new Error('Tatoeba cache wiring missing');"
      - name: Run v1.4 education P0 tests
        run: node scripts/test-v1.4-education.mjs
      - name: Run v1.4 education P1 tests
        run: node scripts/test-v1.4-p1.mjs
      - name: Commit canonical generated files
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js v1.4-education-migration.js v1.4-education-core.js v1.4-education-ui.js scripts/apply-v1.3-static.mjs
          git add -u
          if git diff --cached --quiet; then echo 'No generated changes'; exit 0; fi
          git commit -m 'build(v1.4): persist canonical educational files [skip ci]'
          git push origin feature/v1.4
