name: Temporary Learning Card verification
on:
  pull_request:
    paths:
      - "frontend/**"
      - "e2e/react-learning-card-flip.spec.mjs"
      - "react-dist/**"
      - ".github/workflows/learning-card-verify-temp.yml"

permissions:
  contents: read

jobs:
  learning-card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        working-directory: .
      - name: Materialize React artifact for E2E
        working-directory: .
        run: |
          cp react-dist/kanji5-react.js react-dist/kanji5-react-release18.js
          cp react-dist/kanji5-react.css react-dist/kanji5-react-release18.css
      - name: Install root test dependencies
        working-directory: .
        run: npm ci
      - name: Install Chromium
        working-directory: .
        run: npx playwright install chromium
      - name: Run Learning Card gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-learning-card-flip.spec.mjs
