# v1.8 compatibility + v1.9 learning-engine validation gate
# v2 P3 verification: accessibility, responsive, and reduced-motion contracts
name: Build Kanji 5 v1.8/v1.9

on:
  push:
    branches:
      - main
    paths:
      - 'v1.9-*.js'
      - 'v1.8-*.js'
      - 'v1.7-*.js'
      - 'v1.6-*.js'
      - 'v1.5-*.js'
      - 'v1.4-*.js'
      - 'v1.3-*.js'
      - 'scripts/test-*.mjs'
      - 'scripts/test-all.mjs'
      - 'e2e/v1.9-*.mjs'
      - 'e2e/v1.8-*.mjs'
      - 'e2e/v1.7-*.mjs'
      - 'V1.9-ROADMAP.md'
      - 'V2-ROADMAP.md'
      - 'v2-*.js'
      - 'v2-*.css'
      - 'e2e/v2-*.mjs'
      - 'V1.8-ROADMAP.md'
      - 'ARCHITECTURE.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'sw.js'
      - 'index.html'
      - '.github/workflows/build-v1.8.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v1.9-*.js'
      - 'v1.8-*.js'
      - 'v1.7-*.js'
      - 'v1.6-*.js'
      - 'v1.5-*.js'
      - 'v1.4-*.js'
      - 'v1.3-*.js'
      - 'scripts/test-*.mjs'
      - 'scripts/test-all.mjs'
      - 'e2e/v1.9-*.mjs'
      - 'e2e/v1.8-*.mjs'
      - 'e2e/v1.7-*.mjs'
      - 'V1.9-ROADMAP.md'
      - 'V2-ROADMAP.md'
      - 'v2-*.js'
      - 'v2-*.css'
      - 'e2e/v2-*.mjs'
      - 'V1.8-ROADMAP.md'
      - 'ARCHITECTURE.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'package.json'
      - 'sw.js'
      - 'index.html'
      - '.github/workflows/build-v1.8.yml'

  workflow_dispatch:

concurrency:
  group: kanji5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-learning-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate npm lockfile
        run: node scripts/test-npm-lockfile.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check v1.9-outcome-core.js
          node --check v1.9-learner-model-core.js
          node --check v1.9-learner-model.js
          node --check v1.9-adaptive-planner-core.js
          node --check v1.9-adaptive-planner.js
          node --check v1.9-recovery-core.js
          node --check v1.9-recovery.js
          node --check v1.9-recovery-ui.js
          node --check v1.9-learning-evaluation-core.js
          node --check v1.9-learning-evaluation.js
          node --check v1.9-data-quality-core.js
          node --check v1.9-data-integrity-core.js
          node --check v1.9-v2-contract-core.js
          node --check v1.9-v2-boundary.js
          node --check v1.8-production-core.js
          node --check v1.8-vocabulary-core.js
          node --check v1.8-context-core.js
          node --check v1.7-adaptive-recall-core.js
          node --check v1.7-evaluation-core.js
          node --check v1.7-baseline-evaluation-core.js
          node --check v1.7-tuning-core.js
          node --check v1.6-session-core.js
          node --check v1.6-session-feedback.js
          node --check v1.6-skill-profile.js
          node --check v2-presentation.js
          node --check review-runtime.js
      - name: Validate v1.9 release contract
        run: node scripts/test-v1.9-release.mjs
      - name: Run learner model regression suite
        run: node scripts/test-v1.9-learner-model.mjs && node scripts/test-v1.9-learner-model-evidence.mjs
      - name: Run deterministic content selection regression
        run: node scripts/test-v1.9-deterministic-content-selection.mjs
      - name: Run v2 P0 presentation contract
        run: node scripts/test-v2-p0-presentation.mjs
      - name: Run v2 localization contract
        run: node scripts/test-v2-localization.mjs
      - name: Run v2 mobile polish contract
        run: node scripts/test-v2-mobile-polish.mjs
      - name: Run v2 exercise-first presentation contract
        run: node scripts/test-v2-exercise-presentation.mjs
      - name: Run v2 P2 session information architecture contract
        run: node scripts/test-v2-p2-session-ia.mjs
      - name: Run v2 P3 accessibility contract
        run: node scripts/test-v2-p3-accessibility.mjs
      - name: Run v2 P4 visual contract
        run: node scripts/test-v2-p4-visual.mjs
      - name: Run v2 P5 release contract
        run: node scripts/test-v2-p5-release.mjs
      - name: Run v2 runtime separation contract
        run: node scripts/test-v2-runtime-separation.mjs
      - name: Run supported v1.8/v1.9/v2 contract suite
        run: node scripts/test-v1.9-release.mjs && node scripts/test-v2-p0-presentation.mjs && node scripts/test-v2-localization.mjs && node scripts/test-v2-mobile-polish.mjs && node scripts/test-v2-exercise-presentation.mjs && node scripts/test-v2-p2-session-ia.mjs && node scripts/test-v2-p3-accessibility.mjs && node scripts/test-v2-p4-visual.mjs && node scripts/test-v2-p5-release.mjs && node scripts/test-v2-runtime-separation.mjs && node scripts/test-v1.8-production.mjs && node scripts/test-v1.8-vocabulary.mjs && node scripts/test-v1.8-context.mjs
      - name: Install CJK fonts for visual testing
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk

      - name: Run browser coverage
        run: |
          npm ci
          npx playwright install chromium
          npx playwright test e2e/v1.7-adaptive-recall.spec.mjs e2e/v1.8-production.spec.mjs e2e/v1.8-vocabulary.spec.mjs e2e/v1.8-context.spec.mjs e2e/v1.9-p0-outcome.spec.mjs e2e/v1.9-p1-learner-model.spec.mjs e2e/v1.9-p2-adaptive-planner.spec.mjs e2e/v1.9-p3-recovery.spec.mjs e2e/v1.9-p4-learning-evaluation.spec.mjs e2e/v1.9-p5-data-offline.spec.mjs e2e/v1.9-p6-v2-boundary.spec.mjs e2e/v2-p0-presentation.spec.mjs e2e/v2-localization.spec.mjs e2e/v2-mobile-polish.spec.mjs e2e/v2-visual-regression.spec.mjs e2e/v2-learning-first.spec.mjs e2e/v2-p1-exercise-flow.spec.mjs e2e/v2-exercise-presentation.spec.mjs e2e/v2-p2-session-ia.spec.mjs e2e/v2-p3-accessibility-responsive.spec.mjs e2e/v2-p3-accessibility.spec.mjs e2e/v2-p4-visual.spec.mjs e2e/v2-p5-release.spec.mjs e2e/v2-service-worker-offline.spec.mjs e2e/v2-session-completion.spec.mjs
