# v1.8 compatibility + v1.9 learning-engine validation gate
# v2 P3 verification: accessibility, responsive, and reduced-motion contracts
name: Build Kanji 5 v1.8/v1.9

on:
  push:
    branches:
      - main
    paths:
      - 'v1.9-*.js'
      - 'v1.8-*.js'
      - 'v1.7-*.js'
      - 'v1.6-*.js'
      - 'v1.5-*.js'
      - 'v1.4-*.js'
      - 'v1.3-*.js'
      - 'scripts/test-*.mjs'
      - 'scripts/test-all.mjs'
      - 'V1.9-ROADMAP.md'
      - 'V2-ROADMAP.md'
      - 'V1.8-ROADMAP.md'
      - 'ARCHITECTURE.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'sw.js'
      - 'index.html'
      - '.github/workflows/build-v1.8.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v1.9-*.js'
      - 'v1.8-*.js'
      - 'v1.7-*.js'
      - 'v1.6-*.js'
      - 'v1.5-*.js'
      - 'v1.4-*.js'
      - 'v1.3-*.js'
      - 'scripts/test-*.mjs'
      - 'scripts/test-all.mjs'
      - 'e2e/v1.9-*.mjs'
      - 'e2e/v1.8-*.mjs'
      - 'e2e/v1.7-*.mjs'
      - 'V1.9-ROADMAP.md'
      - 'V2-ROADMAP.md'
      - 'V1.8-ROADMAP.md'
      - 'ARCHITECTURE.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'package.json'
      - 'sw.js'
      - 'index.html'
      - '.github/workflows/build-v1.8.yml'

  workflow_dispatch:

concurrency:
  group: kanji5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-learning-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate npm lockfile
        run: node scripts/test-npm-lockfile.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check v1.9-outcome-core.js
          node --check v1.9-learner-model-core.js
          node --check v1.9-learner-model.js
          node --check v1.9-adaptive-planner-core.js
          node --check v1.9-adaptive-planner.js
          node --check v1.9-recovery-core.js
          node --check v1.9-recovery.js
          node --check v1.9-learning-evaluation-core.js
          node --check v1.9-learning-evaluation.js
          node --check v1.9-data-quality-core.js
          node --check v1.9-data-integrity-core.js
          node --check v1.9-v2-contract-core.js
          node --check v1.9-v2-boundary.js
          node --check v1.8-production-core.js
          node --check v1.8-vocabulary-core.js
          node --check v1.8-context-core.js
          node --check v1.7-adaptive-recall-core.js
          node --check v1.7-evaluation-core.js
          node --check v1.7-baseline-evaluation-core.js
          node --check v1.7-tuning-core.js
          node --check v1.6-session-core.js
          node --check v1.6-session-feedback.js
          node --check v1.6-skill-profile.js
          node --check review-runtime.js
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build React shipped artifact
        working-directory: frontend
        run: npm run build
      - name: Install root dependencies for lockfile verification
        run: npm ci --ignore-scripts
      - name: Validate v1.9 release contract
        run: node scripts/test-v1.9-release.mjs
      - name: Run learner model regression suite
        run: node scripts/test-v1.9-learner-model.mjs && node scripts/test-v1.9-learner-model-evidence.mjs
      - name: Run deterministic content selection regression
        run: node scripts/test-v1.9-deterministic-content-selection.mjs
      - name: Run aggregate contract and unit tests
        run: npm test
      - name: Run React presentation contract gate
        run: node scripts/test-react-migration.mjs

      # Legacy DOM browser suites are retired with the legacy presentation shell.
      # Engine contracts are covered above; browser/presentation coverage is authoritative in react-frontend.yml.
