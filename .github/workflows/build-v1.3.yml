name: Build Kanji 5 v1.3

on:
  push:
    branches: [feature/v1.3]
    paths:
      - 'index.html'
      - 'kanji-data.json'
      - 'kanji-joyo.json'
      - 'scripts/**'
      - 'v1.3-*.js'
      - 'v1.2-*.js'
      - 'vendor/ts-fsrs-5.4.1.mjs'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '.github/workflows/build-v1.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate dataset
        run: |
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('kanji-data.json','utf8')); if(d.count!==2136 || !Array.isArray(d.kanji) || d.kanji.length!==2136) throw new Error('Invalid runtime dataset'); console.log('Validated 2,136 Joyo kanji');"
      - name: Validate local FSRS
        run: |
          node --check vendor/ts-fsrs-5.4.1.mjs
          node -e "const fs=require('fs'); const s=fs.readFileSync('v1.3-p0.js','utf8'); if(s.includes('esm.sh')) throw new Error('Runtime still references esm.sh'); if(!s.includes('./vendor/ts-fsrs-5.4.1.mjs')) throw new Error('Local FSRS reference missing');"
      - name: Validate v1.3 scripts
        run: |
          node --check v1.3-p1.js
          node --check v1.3-p0.js
          node --check v1.3-dont-know.js
          node --check v1.3-perf.js
          node --check v1.3-storage-bridge.js
          node --check v1.3-settings.js
      - name: Validate performance instrumentation
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('v1.3-perf.js','utf8'); if(!s.includes(\"marks['app-ready']\")) throw new Error('app-ready mark must use bracket notation');"
      - name: Validate Service Worker
        run: |
          node --check sw.js
          node -e "const fs=require('fs'); const s=fs.readFileSync('sw.js','utf8'); if(!s.includes('vendor/ts-fsrs-5.4.1.mjs')) throw new Error('FSRS is not in shell cache'); if(!s.includes('v1.3-p0.js')) throw new Error('v1.3-p0 missing from shell');"
      - name: Smoke test browser-facing wiring
        run: node scripts/smoke-test-v1.3.mjs
