name: Build Kanji 5 v1.3

on:
  push:
    branches: [feature/v1.3]
    paths:
      - 'index.html'
      - 'kanji-data.json'
      - 'kanji-joyo.json'
      - 'scripts/**'
      - 'v1.4-education-core.js'
      - 'v1.3-*.js'
      - 'v1.2-*.js'
      - 'vendor/ts-fsrs-5.4.1.mjs'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '.github/workflows/build-v1.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic static v1.3 wiring
        run: node scripts/apply-v1.3-static.mjs
      - name: Remove obsolete v1.3 scripts
        run: rm -f v1.3-production-ui.js v1.3-education-v2.js v1.3-dont-know.js v1.3-smart-distractors.js scripts/apply-smart-distractors.mjs
      - name: Validate dataset
        run: |
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('kanji-data.json','utf8')); if(d.count!==2136 || !Array.isArray(d.kanji) || d.kanji.length!==2136) throw new Error('Invalid runtime dataset');"
      - name: Validate JavaScript and local FSRS
        run: |
          node --check vendor/ts-fsrs-5.4.1.mjs
          node --check v1.3-p0.js
          node --check v1.3-p1.js
          node --check v1.3-perf.js
          node --check v1.3-storage-bridge.js
          node --check v1.3-settings.js
          node --check v1.4-education-core.js
          node --check v1.3-education-runtime-fix.js
          node --check sw.js
      - name: Validate education architecture
        run: |
          node -e "const fs=require('fs'); const p=fs.readFileSync('v1.3-p1.js','utf8'); const g=fs.readFileSync('v1.3-education-runtime-fix.js','utf8'); const c=fs.readFileSync('v1.4-education-core.js','utf8'); const h=fs.readFileSync('index.html','utf8'); const w=fs.readFileSync('sw.js','utf8'); if(h.includes('./v1.3-smart-distractors.js')||w.includes('./v1.3-smart-distractors.js')) throw new Error('Obsolete smart distractor wiring remains'); if(!h.includes('./v1.4-education-core.js')) throw new Error('Education core missing from index.html'); if(!w.includes('./v1.4-education-core.js')) throw new Error('Education core missing from service worker shell'); if(!p.includes('EDU_CORE')||!p.includes('EDU_CORE.chooseMode')||!p.includes('EDU_CORE.recordKnowledge')) throw new Error('P1 is not connected to education core'); if(!c.includes("version:'1.4.0-p0'")||!c.includes('registry')||!c.includes('gradeMeaning')||!c.includes('gradeReading')||!c.includes('chooseMode')) throw new Error('v1.4 P0 education core is incomplete'); if(!g.includes('__KANJI5_P0_DATA_PROMISE')||!g.includes('stopPropagation')||!g.includes('waitForEducation')) throw new Error('Education dataset guard is not installed');"
      - name: Smoke test v1.3
        run: node scripts/smoke-test-v1.3.mjs
      - name: Commit generated build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js v1.4-education-core.js v1.3-p1.js scripts/smoke-test-v1.3.mjs scripts/apply-v1.3-static.mjs
          git add -u
          if git diff --cached --quiet; then echo 'No generated changes to commit'; else git commit -m 'build(v1.4): wire educational knowledge core [skip ci]'; git push origin feature/v1.3; fi
