name: Build Kanji 5 v1.3

on:
  push:
    branches: [feature/v1.3]
    paths:
      - 'index.html'
      - 'kanji-data.json'
      - 'kanji-joyo.json'
      - 'scripts/**'
      - 'v1.3-*.js'
      - 'v1.2-*.js'
      - 'vendor/ts-fsrs-5.4.1.mjs'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '.github/workflows/build-v1.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply static v1.3 wiring
        run: node scripts/apply-v1.3-static.mjs
      - name: Remove dead v1.3 scripts
        run: rm -f v1.3-production-ui.js v1.3-education-v2.js v1.3-dont-know.js v1.3-smart-distractors.js scripts/apply-smart-distractors.mjs
      - name: Validate dataset
        run: |
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('kanji-data.json','utf8')); if(d.count!==2136 || !Array.isArray(d.kanji) || d.kanji.length!==2136) throw new Error('Invalid runtime dataset');"
      - name: Validate local FSRS and scripts
        run: |
          node --check vendor/ts-fsrs-5.4.1.mjs
          node --check v1.3-p0.js
          node --check v1.3-p1.js
          node --check v1.3-perf.js
          node --check v1.3-storage-bridge.js
          node --check v1.3-settings.js
          node --check sw.js
      - name: Validate smart distractors
        run: |
          node -e "const fs=require('fs'); const p=fs.readFileSync('v1.3-p1.js','utf8'); const h=fs.readFileSync('index.html','utf8'); const w=fs.readFileSync('sw.js','utf8'); if(h.includes('./v1.3-smart-distractors.js')) throw new Error('Obsolete smart distractor script still wired into index.html'); if(w.includes('./v1.3-smart-distractors.js')) throw new Error('Obsolete smart distractor script still wired into service worker'); if(!p.includes('function scoreDistractor') || !p.includes('function chooseChoices')) throw new Error('Canonical smart distractor logic missing'); if(!p.includes('history=readKnowledge()[target.character]?.distractors')) throw new Error('Personal distractor history missing'); if(!p.includes('sharedReading') || !p.includes('sharedMeaning') || !p.includes('strokeScore')) throw new Error('Smart distractor scoring missing'); if(!p.includes('function mastery(') || !p.includes('mastery(target.character')) throw new Error('Difficulty calibration missing');"
      - name: Smoke test v1.3
        run: node scripts/smoke-test-v1.3.mjs
      - name: Commit generated build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js v1.3-p1.js scripts/smoke-test-v1.3.mjs scripts/apply-v1.3-static.mjs
          git add -u
          if git diff --cached --quiet; then echo 'No generated changes to commit'; else git commit -m 'build(v1.3): stabilize canonical education pipeline [skip ci]'; git push origin feature/v1.3; fi
