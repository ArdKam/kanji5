name: v1.5 staged maintenance

on:
  push:
    branches: [feature/v1.5]
    paths:
      - scripts/v1.5-maintenance-stage.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply staged maintenance patch
        run: node scripts/v1.5-maintenance.mjs
      - name: Validate staged patch
        run: |
          node --check v1.2-enhancements.js
          test "$(grep -c 'v1.2-recall-result-fix' index.html || true)" = "0"
          test "$(grep -c 'setInterval(paint, 500)' index.html || true)" = "0"
          test "$(grep -c 'observer.observe(document.body, {childList:true,subtree:true})' index.html || true)" = "0"
          test "$(grep -c 'observer.observe(document.body, { childList: true, subtree: true })' v1.2-enhancements.js || true)" = "0"
          grep -q 'const studyRoot = document.getElementById("studyPanel") || document.getElementById("study")' v1.2-enhancements.js
          git diff --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html v1.2-enhancements.js
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "fix(v1.5): remove duplicate recall observer and polling"
          git push origin HEAD:feature/v1.5
