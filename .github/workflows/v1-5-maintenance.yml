name: v1.5 staged maintenance

on:
  push:
    branches: [feature/v1.5]
    paths:
      - scripts/v1.5-maintenance-stage.txt
      - scripts/v1.5-p2-3.mjs
      - scripts/v1.5-roadmap-finalize.mjs
      - scripts/test-v1.5-roadmap-final.mjs
      - .github/workflows/v1-5-maintenance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply staged maintenance patch
        run: |
          stage="$(tr -d '[:space:]' < scripts/v1.5-maintenance-stage.txt)"
          if [ "$stage" != "final2" ]; then node scripts/v1.5-maintenance.mjs; fi
          if [ "$stage" = "p1-1" ]; then node scripts/v1.5-p1-1.mjs; fi
          if [ "$stage" = "p1-2" ]; then node scripts/v1.5-p1-2.mjs; fi
          if [ "$stage" = "p1-6" ]; then node scripts/v1.5-p1-6.mjs; fi
          if [ "$stage" = "p2-1" ]; then node scripts/v1.5-p2-1.mjs; fi
          if [ "$stage" = "p2-2" ]; then node scripts/v1.5-p2-2.mjs; fi
          if [ "$stage" = "p2-3" ]; then node scripts/v1.5-p2-3.mjs; fi
          if [ "$stage" = "final" ] || [ "$stage" = "final2" ]; then node scripts/v1.5-roadmap-finalize.mjs; fi
      - name: Validate staged patch
        run: |
          node --check v1.2-enhancements.js
          node --check v1.5-p0.js
          node --check v1.5-recall-core.js
          node --check v1.4-education-ui.js
          node --check v1.4-education-migration.js
          node --check v1.5-state.js
          node --check supabase-sync.js
          node --check v1.5-education-sync-core.js
          node --check v1.5-fsrs-sync-core.js
          node --check sw.js
          node --check scripts/test-v1.5-p0.mjs
          node --check scripts/test-v1.5-p0-learning.mjs
          node --check scripts/test-v1.5-dont-know.mjs
          node --check scripts/test-v1.5-jlpt-order.mjs
          node --check scripts/test-v1.5-v13-parity.mjs
          node --check scripts/test-v1.5-roadmap-final.mjs
          node --check scripts/test-v1.4-p1.mjs
          node --check scripts/test-v1.4-education.mjs
          node scripts/test-v1.5-p0.mjs
          node scripts/test-v1.5-p0-learning.mjs
          node scripts/test-v1.5-dont-know.mjs
          node scripts/test-v1.5-v13-parity.mjs
          node scripts/test-v1.4-p1.mjs
          node scripts/test-v1.4-education.mjs
          node scripts/test-v1.5-component-scheduler.mjs
          node scripts/test-v1.5-roadmap-final.mjs
          test "$(grep -c 'v1.2-recall-result-fix' index.html || true)" = "0"
          test "$(grep -c 'setInterval(paint, 500)' index.html || true)" = "0"
          grep -q 'studyPanel' v1.2-enhancements.js
          test "$(grep -c '<script src=\"./v1.5-p0.js\"></script>' index.html || true)" = "1"
          git diff --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html v1.2-enhancements.js v1.4-education-ui.js v1.4-education-migration.js v1.5-state.js v1.5-p0.js v1.5-recall-core.js sw.js scripts/test-v1.5-p0.mjs scripts/test-v1.5-education-dom.mjs scripts/test-v1.5-init-sharing.mjs scripts/test-v1.5-daily-sync.mjs scripts/test-v1.5-runtime-reviews.mjs scripts/test-v1.5-component-scheduler.mjs scripts/test-v1.5-education-merge.mjs scripts/v1.5-p1-1.mjs scripts/v1.5-p1-2.mjs scripts/v1.5-p1-6.mjs scripts/v1.5-p2-1.mjs scripts/v1.5-p2-2.mjs scripts/v1.5-p2-3.mjs scripts/test-v1.5-fsrs-sync.mjs scripts/test-v1.5-persistence-slices.mjs scripts/test-v1.5-sw-cache-bound.mjs scripts/test-v1.5-api-cache.mjs scripts/test-v1.5-state-module.mjs scripts/test-v1.5-migration-chain.mjs scripts/v1.5-roadmap-finalize.mjs scripts/test-v1.5-roadmap-final.mjs scripts/v1.5-maintenance.mjs scripts/v1.5-maintenance-stage.txt supabase-sync.js v1.5-education-sync-core.js v1.5-fsrs-sync-core.js .github/workflows/v1-5-maintenance.yml
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          stage="$(tr -d '[:space:]' < scripts/v1.5-maintenance-stage.txt)"
          git commit -m "fix(v1.5): make ${stage} maintenance green"
          git push origin HEAD:feature/v1.5
