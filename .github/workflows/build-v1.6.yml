# v1.6 validation workflow — deterministic, source-immutable CI
name: Build Kanji 5 v1.6
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: kanji5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate CI checkout invariant
        run: node scripts/test-ci-workflow.mjs
      - name: Validate npm lockfile
        run: node scripts/test-npm-lockfile.mjs
      - name: Validate dataset
        run: node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('kanji-data.json','utf8'));if(d.count!==2136||!Array.isArray(d.kanji)||d.kanji.length!==2136)throw new Error('Invalid runtime dataset');"
      - name: Validate JavaScript
        run: |
          for f in v1.3-p0.js v1.4-education-migration.js v1.4-education-core.js v1.5-recall-core.js v1.5-p0.js v1.5-state.js v1.5-network.js v1.5-education-ui.js v1.5-education-sync-core.js v1.5-fsrs-sync-core.js v1.5-sync-core.js v1.6-session.js v1.6-session-core.js v1.6-session-feedback.js v1.6-session-analytics.js v1.6-skill-profile.js v1.6-sync-core.js v1.6-session-ui.js v1.8-production-core.js v1.8-vocabulary-core.js v1.8-context-core.js v1.2-runtime-fixes.js supabase-sync.js sw.js vendor/ts-fsrs-5.4.1.mjs; do node --check "$f"; done
          for f in scripts/test-v1.4-education.mjs scripts/test-v1.4-p1.mjs scripts/test-v1.5-p0.mjs scripts/test-v1.5-recall-core.mjs scripts/test-v1.5-p0-learning.mjs scripts/test-v1.5-dont-know.mjs scripts/test-v1.5-fsrs-sync.mjs scripts/test-v1.5-sync.mjs scripts/test-v1.5-sync-lifecycle.mjs scripts/test-v1.5-persistence.mjs scripts/test-v1.5-architecture.mjs scripts/test-v1.5-network.mjs scripts/test-v1.5-jlpt-order.mjs scripts/test-v1.5-roadmap-final.mjs scripts/test-v1.5-v13-parity.mjs scripts/test-v1.6-session.mjs scripts/test-v1.6-session-core.mjs scripts/test-v1.6-profile-planning.mjs scripts/test-v1.6-session-feedback.mjs scripts/test-v1.6-session-analytics.mjs scripts/test-v1.6-skill-profile.mjs scripts/test-v1.6-sync.mjs scripts/test-v1.6-release.mjs scripts/test-retired-shims.mjs scripts/test-v1.8-production.mjs scripts/test-v1.8-vocabulary.mjs scripts/test-v1.8-context.mjs scripts/test-v1.8-status.mjs scripts/test-v1.8-ux-runtime.mjs; do node --check "$f"; done
      - name: Validate v1.5 contracts and behavior
        run: node scripts/test-v1.5-suite.mjs
      - name: Upload v1.5 suite diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kanji5-v1.5-suite-output
          path: v1.5-suite-output.txt
      - name: Validate v1.6 contracts and behavior
        run: node scripts/test-v1.6-session.mjs && node scripts/test-v1.6-session-core.mjs && node scripts/test-v1.6-profile-planning.mjs && node scripts/test-v1.6-session-feedback.mjs && node scripts/test-v1.6-session-analytics.mjs && node scripts/test-v1.6-skill-profile.mjs && node scripts/test-v1.6-sync.mjs
      - name: Validate v1.6 release contract
        run: node scripts/test-v1.6-release.mjs
      - name: Install root dependencies for lockfile verification
        run: npm ci --ignore-scripts
      # Browser presentation coverage moved to the React presentation workflow.
      # The v1.6 contract/unit suite above remains authoritative for the engine.
      - name: Verify checked-out tree is committed and immutable
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(node -p "require('./package.json').version")" = "1.6.0" || test "$(node -p "require('./package.json').version")" = "1.7.0" || test "$(node -p "require('./package.json').version")" = "1.8.0" || test "$(node -p "require('./package.json').version")" = "1.9.0" || test "$(node -p "require('./package.json').version")" = "2.0.0"
          grep -q '"type": "module"' package.json
          grep -Eq "const CACHE='kanji5-shell-[A-Za-z0-9._-]+'" sw.js
          grep -q 'function staleWhileRevalidate' sw.js
          grep -q 'function dynamicSameOrigin' sw.js
          ! grep -q '"./v1.6-ui-hotfix-safe.js"' sw.js
          ! grep -q '"./v1.4-education-ui.js"' sw.js
          for f in v1.5-state.js v1.5-recall-core.js v1.5-p0.js v1.5-network.js v1.5-education-ui.js v1.5-education-sync-core.js v1.5-fsrs-sync-core.js v1.5-sync-core.js v1.6-session.js v1.6-session-core.js v1.6-session-feedback.js v1.6-session-analytics.js v1.6-skill-profile.js v1.6-sync-core.js v1.6-session-ui.js v1.8-production-core.js v1.8-vocabulary-core.js v1.8-context-core.js; do grep -q "./$f" sw.js; done
          grep -q 'SNAPSHOT_STORAGE' v1.5-state.js
          grep -q 'SNAPSHOT_COMMIT' v1.5-state.js
          grep -q 'PERSISTENCE_SCHEMA_VERSION' v1.5-state.js
          grep -q 'function transaction' v1.5-state.js
          grep -q "import('./v1.6-session.js')" v1.5-p0.js
          grep -q 'scripts/test-v1.6-release.mjs' .github/workflows/build-v1.6.yml
          grep -q 'scripts/test-v1.8-vocabulary.mjs' .github/workflows/build-v1.6.yml
          grep -q 'mergeV16SyncData' v1.6-sync-core.js
          grep -q 'v16SyncSchemaVersion' supabase-sync.js
          grep -q 'COMPONENT_KEY' supabase-sync.js
          grep -q 'SESSION_HISTORY_KEY' supabase-sync.js
          ! grep -Eq '^[[:space:]]+git[[:space:]]+push[[:space:]]+origin([[:space:]]|$)' .github/workflows/build-v1.6.yml
          ! grep -Eq '^[[:space:]]+node[[:space:]]+scripts/v1.5-roadmap-finalize\.mjs([[:space:]]|$)' .github/workflows/build-v1.6.yml
