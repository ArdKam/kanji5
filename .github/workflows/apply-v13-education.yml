name: Apply v1.3 education P0

on:
  push:
    branches: [feature/v1.3]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.3
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Patch P0 learning flow
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          enh_path = Path('v1.2-enhancements.js')
          index = index_path.read_text(encoding='utf-8')
          enh = enh_path.read_text(encoding='utf-8')

          marker = '<style id="v1.3-education">'
          if marker not in index:
              css = '''<style id="v1.3-education">\n.first-exposure-reading{text-align:center;color:var(--muted);font-size:20px;line-height:1.7;margin:-4px 0 16px;direction:ltr}.first-exposure-reading .hira{font-size:24px;font-weight:750}.first-exposure-reading .roma{font-size:14px;opacity:.78;margin-top:2px}@media(max-width:700px){.first-exposure-reading{font-size:18px}.first-exposure-reading .hira{font-size:22px}}\n</style>'''
              index = index.replace('</head>', css + '</head>', 1)

          old = '<div class="kanjirow"><div class="kanji">${item.character}</div></div><div style="text-align:center;margin:-6px 0 14px">'
          new = '<div class="kanjirow"><div class="kanji" data-kanji-id="${item.id}">${item.character}</div></div><div class="first-exposure-reading" style="display:${!rec?"block":"none"}"><div class="hira">${(!rec?[...(item.on||[]),...(item.kun||[])].slice(0,3):[]).join(" · ")}</div><div class="roma">${(!rec?[...(item.on||[]),...(item.kun||[])].slice(0,3).map(r=>r):[]).join(" · ")}</div></div><div style="text-align:center;margin:-6px 0 14px">'
          if old not in index:
              raise SystemExit('Could not locate renderCard kanji markup')
          index = index.replace(old, new, 1)

          old_hint = '<div class="hint">اول خودت معنی یا خوانش را حدس بزن.</div><button class="reveal" id="revealBtn">نمایش پاسخ</button>'
          new_hint = '<div class="hint">${rec?"اول خودت معنی یا خوانش را حدس بزن.":"این اولین آشنایی تو با این کانجی است؛ فعلاً فقط آن را یاد بگیر."}</div><button class="reveal" id="revealBtn">${rec?"نمایش پاسخ":"نمایش اطلاعات کانجی"}</button>'
          if old_hint not in index:
              raise SystemExit('Could not locate renderCard hint markup')
          index = index.replace(old_hint, new_hint, 1)

          # Replace only the capture handler so first exposure bypasses active recall.
          old_handler = '''    if (target?.id === "revealBtn" && !allowNativeReveal) {\n      event.preventDefault(); event.stopImmediatePropagation(); makeRecallGate(); return;\n    }'''
          new_handler = '''    if (target?.id === "revealBtn" && !allowNativeReveal) {\n      const kanjiEl = document.querySelector(".kanji[data-kanji-id]");\n      const id = kanjiEl?.dataset?.kanjiId;\n      let isFirstExposure = false;\n      try {\n        const raw = localStorage.getItem("kanji5-v1");\n        const saved = raw ? JSON.parse(raw) : null;\n        isFirstExposure = !!id && !saved?.cards?.[id];\n      } catch (_) {}\n      if (isFirstExposure) return;\n      event.preventDefault(); event.stopImmediatePropagation(); makeRecallGate(); return;\n    }'''
          if old_handler not in enh:
              raise SystemExit('Could not locate recall capture handler')
          enh = enh.replace(old_handler, new_handler, 1)

          index_path.write_text(index, encoding='utf-8')
          enh_path.write_text(enh, encoding='utf-8')
          print('P0 patch applied')
          PY

      - name: Validate JavaScript
        run: |
          node --check v1.2-enhancements.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'data-kanji-id="${item.id}"' in s
          assert 'first-exposure-reading' in s
          assert 'این اولین آشنایی تو با این کانجی است' in s
          print('P0 validation passed')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html v1.2-enhancements.js
          git diff --cached --quiet || git commit -m 'feat(v1.3): add P0 learning flow [skip ci]'
          git push origin HEAD:feature/v1.3