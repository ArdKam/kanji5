# v1.5 P0 validation workflow
name: Build Kanji 5 v1.5

on:
  push:
    branches: [feature/v1.5]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate dataset
        run: node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('kanji-data.json','utf8'));if(d.count!==2136||!Array.isArray(d.kanji)||d.kanji.length!==2136)throw new Error('Invalid runtime dataset');"
      - name: Validate JavaScript
        run: |
          node --check v1.3-p0.js
          node --check v1.3-perf.js
          node --check v1.3-storage-bridge.js
          node --check v1.3-settings.js
          node --check v1.4-education-migration.js
          node --check v1.4-education-core.js
          node --check v1.4-education-ui.js
          node --check v1.5-p0.js
          node --check v1.5-state.js
          node --check v1.5-education-sync-core.js
          node --check v1.5-fsrs-sync-core.js
          node --check v1.2-runtime-fixes.js
          node --check scripts/apply-v1.3-static.mjs
          node --check scripts/apply-v1.5-p0.mjs
          node --check scripts/test-v1.4-education.mjs
          node --check scripts/test-v1.4-p1.mjs
          node --check scripts/test-v1.5-p0.mjs
          node --check scripts/test-v1.5-p0-learning.mjs
          node --check scripts/test-v1.5-dont-know.mjs
          node --check scripts/test-v1.5-fsrs-sync.mjs
          node --check scripts/test-v1.5-jlpt-order.mjs
          node --check scripts/test-v1.5-v13-parity.mjs
          node --check supabase-sync.js
          node --check sw.js
          node --check vendor/ts-fsrs-5.4.1.mjs
      - name: Validate v1.5 contracts and behavior
        run: node scripts/test-v1.5-p0.mjs && node scripts/test-v1.5-p0-learning.mjs && node scripts/test-v1.5-dont-know.mjs && node scripts/test-v1.5-fsrs-sync.mjs && node scripts/test-v1.5-jlpt-order.mjs && node scripts/test-v1.5-v13-parity.mjs && node scripts/test-v1.4-p1.mjs && node scripts/test-v1.4-education.mjs
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npx playwright test e2e/app-smoke.spec.mjs
      - name: Verify committed build output
        shell: bash
        run: |
          set -euo pipefail
          echo 'check: git diff --check'
          git diff --check
          echo 'check: shell cache version'
          grep -q "const CACHE='kanji5-shell-v46'" sw.js
          echo 'check: SW helpers'
          grep -q "function staleWhileRevalidate" sw.js
          grep -q "function dynamicSameOrigin" sw.js
          echo 'check: offline runtime dependencies'
          grep -q '"./v1.5-state.js"' sw.js
          grep -q '"./v1.5-p0.js"' sw.js
          grep -q '"./v1.5-education-sync-core.js"' sw.js
          grep -q '"./v1.5-fsrs-sync-core.js"' sw.js
          echo 'check: removed obsolete runtime'
          test "$(grep -c 'v1.5-education-choice-enforcer.js' sw.js || true)" = "0"
          test "$(grep -c 'v15-production-choice' v1.5-p0.js || true)" = "0"
          echo 'check: production education contract'
          grep -q "prompt='برای معنی زیر، کانجی مناسب را انتخاب کن.'" v1.4-education-ui.js
          grep -q 'renderChoices(chooseChoices(item))' v1.4-education-ui.js
          test "$(grep -c 'v14EduProductionInput' v1.4-education-ui.js || true)" = "0"
          echo 'check: Active Recall anti-leak'
          test "$(grep -c 'معنی هدف:' v1.5-p0.js || true)" = "0"
          test "$(grep -c 'خوانش هدف:' v1.5-p0.js || true)" = "0"
          echo 'check: FSRS replay contract'
          grep -q 'eventSchemaVersion' v1.5-fsrs-sync-core.js
          echo 'check: workflow and clean tree'
          grep -q 'feature/v1.5' .github/workflows/build-v1.5.yml
          git status --short
          test -z "$(git status --porcelain)"
