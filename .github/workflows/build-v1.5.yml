# v1.6 validation workflow — deterministic, source-immutable CI
# Session Dashboard 2.0 validation gate
name: Build Kanji 5 v1.6
on:
  push:
    branches: [feature/v1.6]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate dataset
        run: node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('kanji-data.json','utf8'));if(d.count!==2136||!Array.isArray(d.kanji)||d.kanji.length!==2136)throw new Error('Invalid runtime dataset');"
      - name: Validate JavaScript
        run: |
          node --check v1.3-p0.js
          node --check v1.3-perf.js
          node --check v1.3-storage-bridge.js
          node --check v1.3-settings.js
          node --check v1.4-education-migration.js
          node --check v1.4-education-core.js
          node --check v1.4-education-ui.js
          node --check v1.5-recall-core.js
          node --check v1.5-p0.js
          node --check v1.5-state.js
          node --check v1.5-network.js
          node --check v1.5-education-ui.js
          node --check v1.5-education-sync-core.js
          node --check v1.5-fsrs-sync-core.js
          node --check v1.5-sync-core.js
          node --check v1.6-session.js
          node --check v1.6-session-core.js
          node --check v1.2-runtime-fixes.js
          node --check scripts/apply-v1.3-static.mjs
          node --check scripts/apply-v1.5-p0.mjs
          node --check scripts/test-v1.4-education.mjs
          node --check scripts/test-v1.4-p1.mjs
          node --check scripts/test-v1.5-p0.mjs
          node --check scripts/test-v1.5-recall-core.mjs
          node --check scripts/test-v1.5-p0-learning.mjs
          node --check scripts/test-v1.5-dont-know.mjs
          node --check scripts/test-v1.5-fsrs-sync.mjs
          node --check scripts/test-v1.5-sync.mjs
          node --check scripts/test-v1.5-sync-lifecycle.mjs
          node --check scripts/test-v1.5-persistence.mjs
          node --check scripts/test-v1.5-architecture.mjs
          node --check scripts/test-v1.5-network.mjs
          node --check scripts/test-v1.5-jlpt-order.mjs
          node --check scripts/test-v1.5-roadmap-final.mjs
          node --check scripts/test-v1.5-v13-parity.mjs
          node --check scripts/test-v1.4-education.mjs
          node --check scripts/test-v1.6-session.mjs
          node --check scripts/test-v1.6-session-core.mjs
          node --check supabase-sync.js
          node --check sw.js
          node --check vendor/ts-fsrs-5.4.1.mjs
      - name: Validate v1.5 contracts and behavior
        run: node scripts/test-v1.5-p0.mjs && node scripts/test-v1.5-recall-core.mjs && node scripts/test-v1.5-p0-learning.mjs && node scripts/test-v1.5-dont-know.mjs && node scripts/test-v1.5-fsrs-sync.mjs && node scripts/test-v1.5-sync.mjs && node scripts/test-v1.5-sync-lifecycle.mjs && node scripts/test-v1.5-persistence.mjs && node scripts/test-v1.5-architecture.mjs && node scripts/test-v1.5-network.mjs && node scripts/test-v1.5-jlpt-order.mjs && node scripts/test-v1.5-roadmap-final.mjs && node scripts/test-v1.5-v13-parity.mjs && node scripts/test-v1.4-p1.mjs && node scripts/test-v1.4-education.mjs
      - name: Validate v1.6 session contract
        run: node scripts/test-v1.6-session.mjs
      - name: Validate v1.6 adaptive session core
        run: node scripts/test-v1.6-session-core.mjs
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run browser tests
        run: npx playwright test e2e
      - name: Verify checked-out tree is committed and immutable
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          grep -q '"type": "module"' package.json
          grep -q "const CACHE='kanji5-shell-v52'" sw.js
          grep -q "function staleWhileRevalidate" sw.js
          grep -q "function dynamicSameOrigin" sw.js
          grep -q '"./v1.5-state.js"' sw.js
          grep -q '"./v1.5-recall-core.js"' sw.js
          grep -q '"./v1.5-p0.js"' sw.js
          grep -q '"./v1.5-network.js"' sw.js
          grep -q '"./v1.5-education-ui.js"' sw.js
          grep -q '"./v1.5-education-ui.css"' sw.js
          grep -q '"./v1.5-education-sync-core.js"' sw.js
          grep -q '"./v1.5-fsrs-sync-core.js"' sw.js
          grep -q '"./v1.5-sync-core.js"' sw.js
          grep -q '"./v1.6-session.js"' sw.js
          grep -q '"./v1.6-session-core.js"' sw.js
          grep -q 'SNAPSHOT_STORAGE' v1.5-state.js
          grep -q 'SNAPSHOT_COMMIT' v1.5-state.js
          grep -q 'PERSISTENCE_SCHEMA_VERSION' v1.5-state.js
          grep -q 'function transaction' v1.5-state.js
          grep -q "import('./v1.6-session.js')" v1.5-p0.js
          grep -q 'scripts/test-v1.6-session.mjs' .github/workflows/build-v1.5.yml
          grep -q 'scripts/test-v1.6-session-core.mjs' .github/workflows/build-v1.5.yml
          grep -q "ACTIVE_STATUS='active'" v1.6-session.js
          grep -q 'remainingModes' v1.6-session.js
          ! grep -Eq '^[[:space:]]+git[[:space:]]+push[[:space:]]+origin([[:space:]]|$)' .github/workflows/build-v1.5.yml
          ! grep -Eq '^[[:space:]]+node[[:space:]]+scripts/v1.5-roadmap-finalize\.mjs([[:space:]]|$)' .github/workflows/build-v1.5.yml