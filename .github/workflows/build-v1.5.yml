name: Build Kanji 5 v1.5

on:
  push:
    branches: [feature/v1.5]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run canonical build wiring
        run: node scripts/apply-v1.3-static.mjs
      - name: Apply v1.5 P0 learning changes
        run: node scripts/apply-v1.5-p0.mjs
      - name: Validate dataset
        run: node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('kanji-data.json','utf8'));if(d.count!==2136||!Array.isArray(d.kanji)||d.kanji.length!==2136)throw new Error('Invalid runtime dataset');"
      - name: Validate JavaScript
        run: |
          node --check v1.3-p0.js
          node --check v1.3-perf.js
          node --check v1.3-storage-bridge.js
          node --check v1.3-settings.js
          node --check v1.4-education-migration.js
          node --check v1.4-education-core.js
          node --check v1.4-education-ui.js
          node --check v1.5-p0.js
          node --check scripts/apply-v1.3-static.mjs
          node --check scripts/apply-v1.5-p0.mjs
          node --check scripts/test-v1.4-education.mjs
          node --check scripts/test-v1.4-p1.mjs
          node --check scripts/test-v1.5-p0.mjs
          node --check scripts/test-v1.5-p0-learning.mjs
          node --check supabase-sync.js
          node --check sw.js
          node --check vendor/ts-fsrs-5.4.1.mjs
      - name: Validate v1.5 contracts
        run: node scripts/test-v1.5-p0.mjs && node scripts/test-v1.5-p0-learning.mjs && node scripts/test-v1.4-p1.mjs && node scripts/test-v1.4-education.mjs
      - name: Verify generated files
        run: |
          git diff --check
          grep -q "const CACHE='kanji5-shell-v38'" sw.js
          grep -q "function dynamicSameOrigin" sw.js
          grep -q '"./v1.5-p0.js"' sw.js
          grep -q 'const pool=getDeck();return \[target,...CORE.chooseDistractors' v1.4-education-ui.js
          grep -q 'function jlptRank(item)' index.html
          grep -q 'feature/v1.5' .github/workflows/build-v1.5.yml
      - name: Commit canonical generated files
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No generated changes'; exit 0; fi
          git commit -m 'build(v1.5): persist P0 learning changes [skip ci]'
          git push origin feature/v1.5
