name: React presentation build
# Release gate includes traditional radical data and contract coverage.

on:
  pull_request:
    paths:
      - "frontend/**"
      - "docs/react-migration.md"
      - ".github/workflows/react-frontend.yml"
      - "scripts/test-react-migration.mjs"
      - "scripts/test-react-shipped-artifact.mjs"
      - "scripts/test-performance-font-loading.mjs"
      - "scripts/test-service-worker-shell.mjs"
      - "scripts/test-react-release-integrity.mjs"
      - "scripts/verify-live-pages-e2e.mjs"
      - "scripts/stage-pages-site.mjs"
      - "scripts/test-public-doc-staging.mjs"
      - "scripts/test-architecture-build-cleanup.mjs"
      - "scripts/test-r12-security.mjs"
      - "scripts/vendor-supabase.mjs"
      - "legacy-loader.js"
      - "theme-bootstrap.js"
      - "supabase/schema.sql"
      - "supabase/migrations/**"
      - "docs/SECURITY-REVIEW.md"
      - "docs/THIRD-PARTY-LICENSES.md"
      - "scripts/test-prepared-mnemonics.mjs"
      - "scripts/test-mnemonic-support.mjs"
      - "scripts/test-kanji-radical-system.mjs"
      - "scripts/test-cross-layer-release-gate.mjs"
      - "scripts/test-floating-experience-nav.mjs"
      - "kanji-radicals.json"
      - "kanji-radical-map.json"
      - "frontend/src/app/mnemonic-support.ts"
      - "frontend/src/app/MnemonicSupport.tsx"
      - "frontend/src/app/mnemonic-support.css"
      - "e2e/react-presentation-migration.spec.mjs"
      - "e2e/react-secondary-experience-polish.spec.mjs"
      - "e2e/react-presentation-parity.spec.mjs"
      - "e2e/react-presentation-offline.spec.mjs"
      - "e2e/react-pwa-stale-client.spec.mjs"
      - "e2e/react-review-practice.spec.mjs"
      - "e2e/react-active-recall-content.spec.mjs"
      - "e2e/react-learning-card-flip.spec.mjs"
      - "e2e/react-personal-mnemonic.spec.mjs"
      - "e2e/react-prepared-mnemonic.spec.mjs"
      - "e2e/react-mnemonic-support.spec.mjs"
      - "e2e/react-accessibility.spec.mjs"
      - "e2e/react-pwa-release.spec.mjs"
      - "e2e/react-final-release-matrix.spec.mjs"
      - "e2e/react-experience-session-isolation.spec.mjs"
      - "e2e/react-engine-boundary-gate.spec.mjs"
      - "e2e/react-experience-nav-visual.spec.mjs"
      - "e2e/react-account-shell.spec.mjs"
      - "e2e/react-onboarding.spec.mjs"
      - "e2e/stats-dialog.spec.mjs"
      - "index.html"
      - "app-bootstrap.js"
      - "react-entry.js"
      - "sw.js"
      - "account-fallback.js"
      - "v1.3-*.js"
      - "v1.4-*.js"
      - "v1.5-*.js"
      - "v1.6-*.js"
      - "v1.7-*.js"
      - "v1.8-*.js"
      - "v1.9-*.js"
      - "review-runtime.js"
      - "v2-observability.js"
      - "v2-scheduling-core.js"
      - "e2e/react-browser-compat.spec.mjs"
      - "playwright.compat.config.mjs"
      - "supabase-sync.js"
      - "vendor/**"
      - "kanji-data.json"
      - "kanji-components.json"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Dependency audit (frontend)
        run: npm audit --audit-level=high --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Vendor pinned Supabase browser runtime
        working-directory: .
        run: node scripts/vendor-supabase.mjs
      - name: Run R12 public-release security checks
        working-directory: .
        run: node scripts/test-r12-security.mjs
      - name: Stage release artifact for R12 security verification
        working-directory: .
        run: node scripts/stage-pages-site.mjs
      - name: Verify staged production artifact
        working-directory: .
        run: |
          node scripts/test-r12-security.mjs _site
          node scripts/verify-pages-site.mjs
      - name: Validate shipped React artifact
        working-directory: .
        run: node scripts/test-react-shipped-artifact.mjs
      - name: Run generated-artifact contracts
        working-directory: .
        run: |
          node scripts/test-performance-font-loading.mjs
          node scripts/test-service-worker-shell.mjs
          node scripts/test-react-release-integrity.mjs
      - name: Validate live Pages smoke script
        working-directory: .
        run: node --check scripts/verify-live-pages-e2e.mjs
      - name: Run generated-artifact presentation contracts
        working-directory: .
        run: |
          node scripts/test-v2-p3-accessibility.mjs
          node scripts/test-v2-p4-visual.mjs
          node scripts/test-v2-v18-parity.mjs
      - name: Run prepared mnemonic coverage test
        working-directory: .
        run: node scripts/test-prepared-mnemonics.mjs
      - name: Run traditional radical contract test
        working-directory: .
        run: node scripts/test-kanji-radical-system.mjs
      - name: Install root test dependencies
        working-directory: .
        run: npm ci
      - name: Dependency audit (root)
        working-directory: .
        run: npm audit --audit-level=high --no-fund
      - name: Run root contract/unit suite
        working-directory: .
        run: npm test
      - name: Install Chromium for React E2E
        working-directory: .
        run: npx playwright install --with-deps chromium
      - name: Run engine-to-React boundary gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-engine-boundary-gate.spec.mjs
      - name: Validate migration boundary
        working-directory: .
        run: node scripts/test-react-migration.mjs
      - name: Run React presentation E2E
        working-directory: .
        run: timeout 120s npx playwright test --timeout=20000 --retries=0 e2e/react-presentation-migration.spec.mjs
      - name: Run React secondary experience polish E2E
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-secondary-experience-polish.spec.mjs
      - name: Run startup performance baseline
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/performance-baseline.spec.mjs
      - name: Run Active Recall content readiness E2E
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-active-recall-content.spec.mjs
      - name: Run prepared mnemonic E2E
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-prepared-mnemonic.spec.mjs
      - name: Run mnemonic support E2E
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-mnemonic-support.spec.mjs
      - name: Run React authoritative parity gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-presentation-parity.spec.mjs
      - name: Run React offline gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-presentation-offline.spec.mjs
      - name: Run stale-client PWA upgrade gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-pwa-stale-client.spec.mjs
      - name: Run Learning/Active Recall session isolation gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-experience-session-isolation.spec.mjs
      - name: Run React accessibility gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-accessibility.spec.mjs
      - name: Prepare HTTPS compatibility server
        working-directory: .
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes             -keyout /tmp/kanji5-compat-key.pem             -out /tmp/kanji5-compat-cert.pem             -days 1             -subj "/CN=127.0.0.1"             -addext "subjectAltName = IP:127.0.0.1"
          echo "KANJI5_COMPAT_HTTPS=1" >> "$GITHUB_ENV"
          echo "KANJI5_TLS_KEY=/tmp/kanji5-compat-key.pem" >> "$GITHUB_ENV"
          echo "KANJI5_TLS_CERT=/tmp/kanji5-compat-cert.pem" >> "$GITHUB_ENV"
      - name: Install Firefox and WebKit compatibility browsers
        working-directory: .
        run: npx playwright install --with-deps firefox webkit
      - name: Run Firefox compatibility smoke
        working-directory: .
        run: npx playwright test --config=playwright.compat.config.mjs --timeout=20000 --retries=0 --project=firefox e2e/react-browser-compat.spec.mjs
      - name: Run WebKit compatibility smoke
        working-directory: .
        run: npx playwright test --config=playwright.compat.config.mjs --timeout=20000 --retries=0 --project=webkit e2e/react-browser-compat.spec.mjs
      - name: Run React PWA release gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-pwa-release.spec.mjs
      - name: Run React final release matrix
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-final-release-matrix.spec.mjs
      - name: Run Lovable-style experience navigation gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-experience-nav-visual.spec.mjs
      - name: Run Data Trust tab persistence gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/data-trust.spec.mjs
      - name: Run account shell gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-account-shell.spec.mjs
      - name: Run first-run onboarding gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-onboarding.spec.mjs
      - name: Run statistics dashboard gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/stats-dialog.spec.mjs
      - name: Run learning card flip gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-learning-card-flip.spec.mjs
      - name: Run personal mnemonic gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-personal-mnemonic.spec.mjs
      - name: Run Review/Practice separation gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-review-practice.spec.mjs
      - name: Run Production Recall keyboard gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-production-recall-keyboard.spec.mjs
