name: React presentation build

on:
  pull_request:
    paths:
      - "frontend/**"
      - "docs/react-migration.md"
      - ".github/workflows/react-frontend.yml"
      - "scripts/test-react-migration.mjs"
      - "scripts/test-react-shipped-artifact.mjs"
      - "e2e/react-presentation-migration.spec.mjs"
      - "e2e/react-presentation-parity.spec.mjs"
      - "e2e/react-presentation-offline.spec.mjs"
      - "e2e/react-review-practice.spec.mjs"
      - "e2e/react-learning-card-flip.spec.mjs"
      - "e2e/react-personal-mnemonic.spec.mjs"
      - "e2e/react-accessibility.spec.mjs"
      - "e2e/react-pwa-release.spec.mjs"
      - "e2e/react-final-release-matrix.spec.mjs"
      - "e2e/react-experience-session-isolation.spec.mjs"
      - "e2e/react-experience-nav-visual.spec.mjs"
      - "e2e/react-account-shell.spec.mjs"
      - "index.html"
      - "app-bootstrap.js"
      - "react-entry.js"
      - "sw.js"
      - "legacy-loader.js"
      - "scripts/stamp-release.mjs"
  push:
    branches:
      - main
      - feature/react-ts-presentation
    paths:
      - "frontend/**"
      - "docs/react-migration.md"
      - ".github/workflows/react-frontend.yml"
      - "scripts/test-react-migration.mjs"
      - "scripts/test-react-shipped-artifact.mjs"
      - "e2e/react-presentation-migration.spec.mjs"
      - "e2e/react-presentation-parity.spec.mjs"
      - "e2e/react-presentation-offline.spec.mjs"
      - "e2e/react-review-practice.spec.mjs"
      - "e2e/react-learning-card-flip.spec.mjs"
      - "e2e/react-accessibility.spec.mjs"
      - "e2e/react-pwa-release.spec.mjs"
      - "e2e/react-final-release-matrix.spec.mjs"
      - "e2e/react-experience-session-isolation.spec.mjs"
      - "e2e/react-experience-nav-visual.spec.mjs"
      - "index.html"
      - "app-bootstrap.js"
      - "react-entry.js"
      - "sw.js"
      - "legacy-loader.js"
      - "scripts/stamp-release.mjs"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Stamp release asset cache-bust
        env:
          KANJI5_RELEASE: ${{ github.sha }}
        working-directory: .
        run: node scripts/stamp-release.mjs
      - run: npm install --no-audit --no-fund
      - name: Typecheck frontend
        id: typecheck
        run: |
          set -o pipefail
          npm run typecheck -- --pretty false 2>&1 | tee ../typecheck-output.txt
      - name: Upload typecheck output on failure
        if: failure()
        working-directory: .
        uses: actions/upload-artifact@v4
        with:
          name: kanji5-typecheck-output
          path: typecheck-output.txt
      - run: npm run build
      - name: Validate shipped React artifact
        working-directory: .
        run: node scripts/test-react-shipped-artifact.mjs
      - name: Install root test dependencies
        working-directory: .
        run: npm ci
      - name: Run contract and unit suite
        working-directory: .
        run: npm test
      - name: Install Chromium
        working-directory: .
        run: npx playwright install chromium
      - name: Validate migration boundary
        working-directory: .
        run: node scripts/test-react-migration.mjs
      - name: Run React presentation E2E
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-presentation-migration.spec.mjs
      - name: Run React authoritative parity gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-presentation-parity.spec.mjs
      - name: Run React offline gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-presentation-offline.spec.mjs
      - name: Run Learning/Active Recall session isolation gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-experience-session-isolation.spec.mjs
      - name: Run React accessibility gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-accessibility.spec.mjs
      - name: Run React PWA release gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-pwa-release.spec.mjs
      - name: Run React final release matrix
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-final-release-matrix.spec.mjs
      - name: Run Lovable-style experience navigation gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-experience-nav-visual.spec.mjs
      - name: Run account shell gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-account-shell.spec.mjs
      - name: Run learning card flip gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-learning-card-flip.spec.mjs
      - name: Run personal mnemonic gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-personal-mnemonic.spec.mjs
      - name: Run Review/Practice separation gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-review-practice.spec.mjs
