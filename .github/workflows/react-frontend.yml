name: React presentation build
# Release gate includes traditional radical data and contract coverage.

on:
  pull_request:
    paths:
      - "frontend/**"
      - "docs/react-migration.md"
      - ".github/workflows/react-frontend.yml"
      - "scripts/test-react-migration.mjs"
      - "scripts/test-react-shipped-artifact.mjs"
      - "scripts/test-prepared-mnemonics.mjs"
      - "scripts/test-mnemonic-support.mjs"
      - "scripts/test-kanji-radical-system.mjs"
      - "scripts/test-floating-experience-nav.mjs"
      - "kanji-radicals.json"
      - "kanji-radical-map.json"
      - "frontend/src/app/mnemonic-support.ts"
      - "frontend/src/app/MnemonicSupport.tsx"
      - "frontend/src/app/mnemonic-support.css"
      - "e2e/react-presentation-migration.spec.mjs"
      - "e2e/react-presentation-parity.spec.mjs"
      - "e2e/react-presentation-offline.spec.mjs"
      - "e2e/react-review-practice.spec.mjs"
      - "e2e/react-active-recall-content.spec.mjs"
      - "e2e/react-learning-card-flip.spec.mjs"
      - "e2e/react-personal-mnemonic.spec.mjs"
      - "e2e/react-prepared-mnemonic.spec.mjs"
      - "e2e/react-mnemonic-support.spec.mjs"
      - "e2e/react-accessibility.spec.mjs"
      - "e2e/react-pwa-release.spec.mjs"
      - "e2e/react-final-release-matrix.spec.mjs"
      - "e2e/react-experience-session-isolation.spec.mjs"
      - "e2e/react-experience-nav-visual.spec.mjs"
      - "e2e/react-account-shell.spec.mjs"
      - "index.html"
      - "app-bootstrap.js"
      - "react-entry.js"
      - "sw.js"
      - "account-fallback.js"
  push:
    branches:
      - main
      - feature/react-ts-presentation
    paths:
      - "frontend/**"
      - "docs/react-migration.md"
      - ".github/workflows/react-frontend.yml"
      - "scripts/test-react-migration.mjs"
      - "scripts/test-react-shipped-artifact.mjs"
      - "scripts/test-prepared-mnemonics.mjs"
      - "scripts/test-kanji-radical-system.mjs"
      - "scripts/test-floating-experience-nav.mjs"
      - "kanji-radicals.json"
      - "kanji-radical-map.json"
      - "e2e/react-presentation-migration.spec.mjs"
      - "e2e/react-prepared-mnemonic.spec.mjs"
      - "e2e/react-mnemonic-support.spec.mjs"
      - "e2e/react-personal-mnemonic.spec.mjs"
      - "e2e/react-presentation-parity.spec.mjs"
      - "e2e/react-presentation-offline.spec.mjs"
      - "e2e/react-review-practice.spec.mjs"
      - "e2e/react-learning-card-flip.spec.mjs"
      - "e2e/react-accessibility.spec.mjs"
      - "e2e/react-pwa-release.spec.mjs"
      - "e2e/react-final-release-matrix.spec.mjs"
      - "e2e/react-experience-session-isolation.spec.mjs"
      - "e2e/react-experience-nav-visual.spec.mjs"
      - "index.html"
      - "app-bootstrap.js"
      - "react-entry.js"
      - "sw.js"
      - "account-fallback.js"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Validate shipped React artifact
        working-directory: .
        run: node scripts/test-react-shipped-artifact.mjs
      - name: Run generated-artifact presentation contracts
        working-directory: .
        run: |
          node scripts/test-v2-p3-accessibility.mjs
          node scripts/test-v2-p4-visual.mjs
          node scripts/test-v2-v18-parity.mjs
      - name: Run prepared mnemonic coverage test
        working-directory: .
        run: node scripts/test-prepared-mnemonics.mjs
      - name: Run traditional radical contract test
        working-directory: .
        run: node scripts/test-kanji-radical-system.mjs
      - name: Install root test dependencies
        working-directory: .
        run: npm ci
      - name: Run root contract/unit suite
        working-directory: .
        run: npm test
      - name: Install Chromium
        working-directory: .
        run: npx playwright install chromium
      - name: Validate migration boundary
        working-directory: .
        run: node scripts/test-react-migration.mjs
      - name: Run React presentation E2E
        working-directory: .
        run: timeout 120s npx playwright test --timeout=20000 --retries=0 e2e/react-presentation-migration.spec.mjs
      - name: Run startup performance baseline
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/performance-baseline.spec.mjs
      - name: Run Active Recall content readiness E2E
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-active-recall-content.spec.mjs
      - name: Run prepared mnemonic E2E
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-prepared-mnemonic.spec.mjs
      - name: Run mnemonic support E2E
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-mnemonic-support.spec.mjs
      - name: Run React authoritative parity gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-presentation-parity.spec.mjs
      - name: Run React offline gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-presentation-offline.spec.mjs
      - name: Run Learning/Active Recall session isolation gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-experience-session-isolation.spec.mjs
      - name: Run React accessibility gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-accessibility.spec.mjs
      - name: Run React PWA release gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-pwa-release.spec.mjs
      - name: Run React final release matrix
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-final-release-matrix.spec.mjs
      - name: Run Lovable-style experience navigation gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-experience-nav-visual.spec.mjs
      - name: Run account shell gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-account-shell.spec.mjs
      - name: Run learning card flip gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-learning-card-flip.spec.mjs
      - name: Run personal mnemonic gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-personal-mnemonic.spec.mjs
      - name: Run Review/Practice separation gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-review-practice.spec.mjs
      - name: Run Production Recall keyboard gate
        working-directory: .
        run: npx playwright test --timeout=20000 --retries=0 e2e/react-production-recall-keyboard.spec.mjs
