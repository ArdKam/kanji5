name: Materialize frontend lockfile

on:
  push:
    branches:
      - chore/engineering-debt-wave1-20261001
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, 'chore(ci): materialize frontend lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/engineering-debt-wave1-20261001
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate frontend lockfile with npm ci
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git diff --cached --quiet && { echo "No lockfile changes."; exit 0; }
          git commit -m "chore(ci): materialize frontend lockfile"
          git push origin "HEAD:chore/engineering-debt-wave1-20261001"
