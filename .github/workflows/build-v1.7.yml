name: Build Kanji 5 v1.7

on:
  push:
    branches: [main]
    paths:
      - 'v1.7-*.js'
      - 'v1.2-enhancements.js'
      - 'scripts/test-v1.7-*.mjs'
      - 'e2e/v1.7-*.mjs'
      - 'V1.7-ROADMAP.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'package.json'
      - '.github/workflows/build-v1.7.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v1.7-*.js'
      - 'v1.2-enhancements.js'
      - 'scripts/test-v1.7-*.mjs'
      - 'e2e/v1.7-*.mjs'
      - 'V1.7-ROADMAP.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - '.github/workflows/build-v1.7.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate-v1-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript
        run: |
          node --check v1.7-adaptive-recall-core.js
          node --check v1.7-evaluation-core.js
          node --check v1.7-baseline-evaluation-core.js
          node --check v1.7-tuning-core.js
          node --check v1.2-enhancements.js
      - name: Run adaptive recall core tests
        run: node scripts/test-v1.7-adaptive-recall.mjs
      - name: Run recall intent contract tests
        run: node scripts/test-v1.7-recall-intent.mjs
      - name: Run evaluation metric tests
        run: node scripts/test-v1.7-evaluation.mjs
      - name: Run persisted adaptive baseline evaluation tests
        run: node scripts/test-v1.7-baseline-evaluation.mjs
      - name: Run tuning tests
        run: node scripts/test-v1.7-tuning.mjs
      - name: Run v1.7 browser tests
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npx playwright install chromium
          npx playwright test e2e/v1.7-adaptive-recall.spec.mjs
