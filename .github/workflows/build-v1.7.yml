name: Build Kanji 5 v1.7

on:
  pull_request:
    branches: [main]
    paths:
      - 'v1.7-*.js'
      - 'v1.8-*.js'
      - 'v1.4-education-core.js'
      - 'v1.5-state.js'
      - 'scripts/test-*.mjs'
      - 'scripts/test-all.mjs'
      - 'scripts/build-kanji-data.mjs'
      - 'V1.7-ROADMAP.md'
      - 'V1.8-ROADMAP.md'
      - 'ARCHITECTURE.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'sw.js'
      - '.github/workflows/build-v1.7.yml'

concurrency:
  group: kanji5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-v1-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate npm lockfile
        run: node scripts/test-npm-lockfile.mjs
      - name: Validate JavaScript
        run: |
          node --check v1.4-education-core.js
          node --check v1.5-state.js
          node --check v1.7-adaptive-recall-core.js
          node --check v1.7-evaluation-core.js
          node --check v1.7-baseline-evaluation-core.js
          node --check v1.7-tuning-core.js
          node --check v1.8-production-core.js
          node --check v1.8-vocabulary-core.js
          node --check v1.8-context-core.js
          node --check v1.2-enhancements.js
      - name: Install root dependencies for lockfile verification
        run: npm ci --ignore-scripts
      - name: Run v1.7 contract and unit tests
        run: |
          node scripts/test-v1.7-adaptive-recall.mjs
          node scripts/test-v1.7-baseline-evaluation.mjs
          node scripts/test-v1.7-evaluation.mjs
          node scripts/test-v1.7-recall-intent.mjs
          node scripts/test-v1.7-tuning.mjs
      # Browser presentation coverage moved to the React presentation workflow.
      # The v1.7 contract/unit suite above remains authoritative for adaptive recall.
