name: Build Kanji 5 v1.7

on:
  push:
    branches: [feature/v1.7]
    paths:
      - 'v1.7-*.js'
      - 'scripts/test-v1.7-*.mjs'
      - '.github/workflows/build-v1.7.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v1.7-*.js'
      - 'scripts/test-v1.7-*.mjs'
      - '.github/workflows/build-v1.7.yml'

permissions:
  contents: read

jobs:
  validate-v1-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript
        run: node --check v1.7-adaptive-recall-core.js
      - name: Run adaptive recall core tests
        run: node scripts/test-v1.7-adaptive-recall.mjs
