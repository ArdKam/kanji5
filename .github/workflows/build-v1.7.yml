name: Build Kanji 5 v1.7

on:
  push:
    branches: [main]
    paths:
      - 'v1.7-*.js'
      - 'v1.8-*.js'
      - 'v1.4-education-core.js'
      - 'v1.3-storage-bridge.js'
      - 'v1.5-state.js'
      - 'scripts/test-*.mjs'
      - 'scripts/test-all.mjs'
      - 'scripts/build-kanji-data.mjs'
      - 'e2e/v1.7-*.mjs'
      - 'e2e/v1.8-*.mjs'
      - 'V1.7-ROADMAP.md'
      - 'V1.8-ROADMAP.md'
      - 'ARCHITECTURE.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'package.json'
      - 'sw.js'
      - '.github/workflows/build-v1.7.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v1.7-*.js'
      - 'v1.8-*.js'
      - 'v1.4-education-core.js'
      - 'v1.3-storage-bridge.js'
      - 'v1.5-state.js'
      - 'scripts/test-*.mjs'
      - 'scripts/test-all.mjs'
      - 'scripts/build-kanji-data.mjs'
      - 'e2e/v1.7-*.mjs'
      - 'e2e/v1.8-*.mjs'
      - 'ARCHITECTURE.md'
      - 'V1.7-ROADMAP.md'
      - 'V1.8-ROADMAP.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'package.json'
      - 'sw.js'
      - '.github/workflows/build-v1.7.yml'

permissions:
  contents: read

jobs:
  validate-v1-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate JavaScript
        run: |
          node --check v1.3-storage-bridge.js
          node --check v1.4-education-core.js
          node --check v1.5-state.js
          node --check v1.7-adaptive-recall-core.js
          node --check v1.7-evaluation-core.js
          node --check v1.7-baseline-evaluation-core.js
          node --check v1.7-tuning-core.js
          node --check v1.8-production-core.js
          node --check v1.8-vocabulary-core.js
          node --check v1.8-context-core.js
          node --check v1.2-enhancements.js
      - name: Run all contract and unit tests
        run: npm test
      - name: Run active release browser tests
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npx playwright install chromium
          npx playwright test e2e/v1.7-adaptive-recall.spec.mjs e2e/v1.8-production.spec.mjs e2e/v1.8-vocabulary.spec.mjs e2e/v1.8-context.spec.mjs
