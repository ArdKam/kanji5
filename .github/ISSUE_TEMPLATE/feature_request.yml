name: Feature request
description: Suggest a focused product or engineering improvement.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Explain the learner/user problem before proposing implementation details.
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
