<style id="kanji5-account-launcher-style">#kanji5-account-launcher{visibility:visible!important;position:absolute!important;left:0!important;top:0!important;z-index:46!important;width:auto!important;min-width:0!important;height:auto!important;min-height:44px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:8px!important;margin:0!important;padding:5px 10px!important;border:1px solid #e3dcc9!important;border-radius:16px!important;background:#fbf8f0!important;color:#1c1a17!important;box-shadow:none!important;font:700 12px/1 system-ui,sans-serif!important;cursor:pointer!important}#kanji5-account-launcher:hover{transform:translateY(-1px);background:#f4efe3}#kanji5-account-launcher.is-ready{visibility:visible!important}@media(max-width:760px){#kanji5-account-launcher{min-width:42px!important;width:42px!important;padding:4px!important}}#kanji5-account-launcher.is-shadowed{visibility:hidden!important;pointer-events:none!important}#root .account-button{visibility:hidden!important;pointer-events:none!important}#kanji5-account-launcher.is-shadowed{visibility:visible!important;pointer-events:auto!important}</style>
<style id="kanji5-header-layout-fix">
.header{position:relative!important;height:56px!important;min-height:56px!important;max-height:56px!important;padding-top:0!important;padding-bottom:0!important;margin-bottom:0!important;gap:6px!important;overflow:visible!important}

.header .eyebrow{font-size:8px!important;line-height:1!important;margin:0 0 3px!important}
.header-actions{min-height:56px!important;gap:6px!important}
.header-menu-trigger{height:42px!important;min-height:42px!important;width:42px!important}
.header .account-button,#kanji5-account-launcher{position:absolute!important;left:0!important;top:0!important;z-index:46!important;visibility:visible!important}
.app-shell{padding-top:0!important}
.content{gap:6px!important}
@media(max-width:760px){
 .app-shell{padding-top:0!important}
 .header{height:54px!important;min-height:54px!important;max-height:54px!important;padding-bottom:0!important;margin-bottom:0!important}
 .header-actions{position:absolute!important;inset:0!important;height:54px!important;min-height:54px!important;display:block!important;pointer-events:none!important}
 .header-actions .header-tools,.header-actions .account-button,#kanji5-account-launcher{pointer-events:auto!important}
 .header-actions .session-progress{position:absolute!important;top:0!important;left:50%!important;width:110px!important;transform:translateX(-50%)!important;margin:0!important;font-size:9px!important;gap:3px!important}
 .header-actions .progress{height:5px!important}
 .header .account-button,#kanji5-account-launcher{left:0!important;top:0!important;width:42px!important;min-width:42px!important;height:42px!important;min-height:42px!important;padding:4px!important;visibility:visible!important}
 .header-menu-trigger{width:42px!important;height:42px!important;min-height:42px!important}
 .content{gap:5px!important}
}
</style>
<style id="kanji5-exercise-density-fix">
